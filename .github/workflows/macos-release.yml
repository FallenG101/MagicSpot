name: macOS release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to receive the DMG
        required: true
        default: v0.7.1

permissions:
  contents: write

jobs:
  macos:
    name: Universal macOS DMG
    runs-on: macos-latest
    timeout-minutes: 50
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-universal
      - name: Build Apple Silicon and Intel binaries
        run: |
          cargo build --locked --release --no-default-features --target aarch64-apple-darwin
          cargo build --locked --release --no-default-features --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/magicspot \
            target/x86_64-apple-darwin/release/magicspot \
            -output target/universal-apple-darwin/release/magicspot
          lipo -info target/universal-apple-darwin/release/magicspot
      - name: Package DMG
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist stage
          packaging/macos/bundle.sh \
            target/universal-apple-darwin/release/magicspot \
            stage/MagicSpot.app \
            "$version"
          mkdir -p stage/dmg
          ditto stage/MagicSpot.app stage/dmg/MagicSpot.app
          ln -s /Applications stage/dmg/Applications
          hdiutil create \
            -volname "MagicSpot" \
            -srcfolder stage/dmg \
            -format UDZO \
            -ov \
            "dist/magicspot-v${version}-macos-universal.dmg"
          shasum -a 256 "dist/magicspot-v${version}-macos-universal.dmg" \
            > "dist/magicspot-v${version}-macos-universal.dmg.sha256"
      - name: Attach DMG to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" dist/* --clobber
              exit 0
            fi
            sleep 10
          done
          echo "Release $RELEASE_TAG was not created within 20 minutes" >&2
          exit 1
